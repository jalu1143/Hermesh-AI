<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hermesh AI Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f11">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            font-family: 'Segoe UI', Roboto, Arial, sans-serif; 
            background: #0f0f11; 
            color: #e3e3e3; 
            height: 100%;
            overflow: hidden;
        }
        body { display: flex; flex-direction: column; }
        .header { 
            background: #16161a; 
            padding: 12px 16px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #24242b;
            flex-shrink: 0;
        }
        .header-title {
            font-size: 1.15rem;
            font-weight: 700;
            background: linear-gradient(45deg, #a8c7fa, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions { display: flex; gap: 8px; }
        .btn-icon {
            background: #24242b;
            border: 1px solid #33333f;
            color: #aaa;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .btn-danger { background: rgba(255,68,68,0.1); border-color: rgba(255,68,68,0.2); color: #ff6b6b; }
        .btn-share { background: rgba(124,77,255,0.1); border-color: rgba(124,77,255,0.2); color: #a8c7fa; }
        
        .token-bar {
            background: #1c1c24;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-bottom: 1px solid #24242b;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .token-bar input {
            flex: 1;
            background: #0f0f11;
            border: 1px solid #33333f;
            padding: 6px 10px;
            border-radius: 6px;
            color: #fff;
            outline: none;
        }
        .btn-save { background: #7c4dff; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }

        .chat-container { 
            flex: 1; 
            padding: 16px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 14px;
            background: radial-gradient(circle at top, #141419 0%, #0f0f11 100%);
        }
        .message { padding: 12px 16px; border-radius: 16px; max-width: 85%; word-wrap: break-word; line-height: 1.4; font-size: 0.95rem; }
        .user { background: linear-gradient(135deg, #2e3038 0%, #1e1f25 100%); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; border: 1px solid #3a3b45; }
        .ai { background: linear-gradient(135deg, #16161a 0%, #121215 100%); color: #e3e3e3; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #24242b; }
        
        .status { font-size: 0.8rem; color: #8a8a93; padding-left: 4px; display: flex; align-items: center; gap: 6px; }
        .pulse-dot { width: 6px; height: 6px; background: #7c4dff; border-radius: 50%; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.8); opacity: 0.5; } }

        .input-area { 
            display: flex; 
            padding: 12px 16px; 
            background: #16161a; 
            border-top: 1px solid #24242b; 
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
            margin-bottom: env(safe-area-inset-bottom);
        }
        .input-wrapper { flex: 1; }
        input.chat-input { width: 100%; padding: 12px 16px; background: #202026; border: 1px solid #2d2d37; border-radius: 24px; color: #fff; outline: none; font-size: 0.95rem; }
        button.btn-send { background: #7c4dff; color: #fff; border: none; padding: 12px 20px; border-radius: 24px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">Hermesh AI Pro</div>
        <div class="header-actions">
            <button class="btn-icon btn-share" onclick="downloadChatLog()">Download Chat</button>
            <button class="btn-icon btn-danger" onclick="clearChat()">Delete Chat</button>
        </div>
    </div>

    <div class="token-bar">
        <span>🔑 HF Token:</span>
        <input type="password" id="tokenInput" placeholder="hf_...">
        <button class="btn-save" onclick="saveToken()">Save Key</button>
    </div>

    <div class="chat-container" id="chat"></div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="msgInput" class="chat-input" placeholder="Ask Hermesh anything..." onkeypress="handleKeyPress(event)">
        </div>
        <button class="btn-send" onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Stable URL update for Qwen 2.5
        const MODEL_URL = "https://api-inference.huggingface.co/models/Qwen/Qwen2.5-7B-Instruct";
        let chatHistory = [];

        window.onload = function() {
            const savedToken = localStorage.getItem('hf_token');
            if(savedToken) document.getElementById('tokenInput').value = savedToken;
            const savedChat = localStorage.getItem('chat_history');
            if(savedChat) { chatHistory = JSON.parse(savedChat); renderHistory(); } else { showInitialMessage(); }
        };

        function saveToken() {
            const token = document.getElementById('tokenInput').value.trim();
            if(!token) return;
            localStorage.setItem('hf_token', token);
            alert("Key Saved Successfully!");
        }

        function showInitialMessage() {
            document.getElementById('chat').innerHTML = `<div class="message ai"><strong>Welcome to Hermesh AI Pro!</strong><br><br>Token daalkar Save Key kijiye. Layout fixed hai, niche chat box me type karke aap kaam nikalwa sakte hain!</div>`;
        }

        function renderHistory() {
            let chat = document.getElementById('chat'); chat.innerHTML = "";
            if(chatHistory.length === 0) { showInitialMessage(); return; }
            chatHistory.forEach(msg => {
                let div = document.createElement('div'); div.className = `message ${msg.sender}`; div.innerText = msg.text; chat.appendChild(div);
            });
            chat.scrollTop = chat.scrollHeight;
        }

        function clearChat() { if(confirm("Delete history?")) { chatHistory = []; localStorage.removeItem('chat_history'); renderHistory(); } }

        function downloadChatLog() {
            if(chatHistory.length === 0) return;
            let text = "--- Chat History ---\n\n";
            chatHistory.forEach(msg => { text += `[${msg.sender.toUpperCase()}]: ${msg.text}\n\n`; });
            let blob = new Blob([text], { type: "text/plain;charset=utf-8" });
            let a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "Hermesh_Chat.txt"; a.click();
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const input = document.getElementById('msgInput'); const query = input.value.trim(); if(!query) return;
            const token = localStorage.getItem('hf_token'); if(!token) { alert("Pehle token save karein!"); return; }
            
            let chat = document.getElementById('chat');
            chatHistory.push({ sender: 'user', text: query });
            localStorage.setItem('chat_history', JSON.stringify(chatHistory));
            renderHistory(); input.value = "";

            let statusDiv = document.createElement('div'); statusDiv.className = "status"; statusDiv.id = "loadingStatus";
            statusDiv.innerHTML = `<div class="pulse-dot"></div> Hermesh is thinking...`;
            chat.appendChild(statusDiv); chat.scrollTop = chat.scrollHeight;

            try {
                const response = await fetch(MODEL_URL, {
                    headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
                    method: "POST",
                    body: JSON.stringify({ inputs: query, parameters: { max_new_tokens: 600, return_full_text: false } }),
                });
                const result = await response.json();
                document.getElementById('loadingStatus').remove();
                
                let aiReply = "";
                if (result && result[0] && result[0].generated_text) {
                    aiReply = result[0].generated_text.trim();
                } else if (result.error && result.error.includes("loading")) {
                    aiReply = "Model backend server par load ho raha hai. Kripya 15 seconds baad firse try karein.";
                } else {
                    aiReply = "Server response error! Token permission check karein.";
                }

                chatHistory.push({ sender: 'ai', text: aiReply });
                localStorage.setItem('chat_history', JSON.stringify(chatHistory)); renderHistory();
            } catch (error) { document.getElementById('loadingStatus').remove(); chatHistory.push({ sender: 'ai', text: "Network error!" }); renderHistory(); }
        }
    </script>
</body>
</html>
